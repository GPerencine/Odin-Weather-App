<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>

    <meta property="og:title" content="Gabriel Perencine | Weather App" />
    <meta
      property="og:description"
      content="An interactive weather application built with HTML, CSS, and JavaScript using the Visual Crossing API as part of The Odin Project JavaScript course."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://gperencine.github.io/Odin-Weather-App/"
    />
    <meta
      property="og:image"
      content="https://gperencine.github.io/Odin-Weather-App/preview.png"
    />
    <meta property="og:site_name" content="Gabriel Perencine" />

    <meta
      name="description"
      content="Interactive weather application developed with HTML, CSS, and JavaScript using the Visual Crossing API, asynchronous JavaScript, dynamic data rendering, and temperature unit conversion."
    />
    <meta name="author" content="Gabriel Perencine" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header><h1>Weather App</h1></header>
    <main>
      <form class="search-box">
        <input
          type="text"
          name="city"
          id="city"
          placeholder="Your city..."
          required
          minlength="5"
        />
        <button type="submit" id="search">Search</button>
        <div class="units-toggle">
          <input
            type="radio"
            id="celsius"
            name="degree"
            value="celsius"
            checked
          />
          <label for="celsius">°C</label>

          <input
            type="radio"
            id="fahrenheit"
            name="degree"
            value="fahrenheit"
          />
          <label for="fahrenheit">°F</label>
        </div>
      </form>
      <div class="container">
        <div class="weather-card"></div>
        <div class="gif-card"></div>
      </div>
    </main>
    <footer>
      <a href="https://github.com/GPerencine/Odin-Weather-App" target="_blank">
        Copyright &copy; Gabriel Perencine
        <img src="./images/github.svg" alt="GitHub Logo" aria-hidden="true" />
      </a>
    </footer>
  </body>
</html>
