<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>

    <meta property="og:title" content="Gabriel Perencine | Todo List" />
    <meta
      property="og:description"
      content="A browser-based Todo List application built with JavaScript, Webpack, and localStorage as part of The Odin Project JavaScript course."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://gperencine.github.io/Odin-Todo-List/"
    />
    <meta
      property="og:image"
      content="https://gperencine.github.io/Odin-Todo-List/preview.png"
    />
    <meta property="og:site_name" content="Gabriel Perencine" />

    <meta
      name="description"
      content="Browser-based Todo List application developed with HTML, CSS, JavaScript, Webpack, and localStorage featuring projects, task management, and persistent client-side data."
    />
    <meta name="author" content="Gabriel Perencine" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <h1>To-Do List</h1>
    </header>
    <aside>
      <nav>
        <button id="Tasks" class="nav-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="24px"
            viewBox="0 -960 960 960"
            width="24px"
            fill="#000000"
          >
            <path
              d="M348.5-291.5Q360-303 360-320t-11.5-28.5Q337-360 320-360t-28.5 11.5Q280-337 280-320t11.5 28.5Q303-280 320-280t28.5-11.5Zm0-160Q360-463 360-480t-11.5-28.5Q337-520 320-520t-28.5 11.5Q280-497 280-480t11.5 28.5Q303-440 320-440t28.5-11.5Zm0-160Q360-623 360-640t-11.5-28.5Q337-680 320-680t-28.5 11.5Q280-657 280-640t11.5 28.5Q303-600 320-600t28.5-11.5ZM440-280h240v-80H440v80Zm0-160h240v-80H440v80Zm0-160h240v-80H440v80ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0-560v560-560Z"
            />
          </svg>
          Tasks
        </button>
        <button id="notes" class="nav-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="24px"
            viewBox="0 -960 960 960"
            width="24px"
            fill="#000000"
          >
            <path
              d="M120-240v-80h480v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"
            />
          </svg>
          Notes
        </button>
        <h2>Projects</h2>
        <div id="project-list"></div>
        <button id="addProject" class="nav-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            height="24px"
            viewBox="0 -960 960 960"
            width="24px"
            fill="#000000"
          >
            <path
              d="M440-280h80v-160h160v-80H520v-160h-80v160H280v80h160v160ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0-560v560-560Z"
            />
          </svg>
          Add Project
        </button>
      </nav>
    </aside>
    <main>
      <div id="content"></div>
    </main>
    <footer>
      <a href="https://github.com/GPerencine/Odin-Todo-List" target="_blank"
        >Copyright &copy; Gabriel Perencine
        <img src="./images/github.svg" alt="GitHub Logo"
      /></a>
    </footer>
    <dialog id="task-modal">
      <h3>Add new task</h3>
      <button id="btn-close-task-modal">X</button>
      <form id="task-form">
        <div class="input-group">
          <label for="title">Title:</label>
          <input type="text" id="title" name="title" required />
        </div>

        <div class="input-group">
          <label for="description">Description:</label>
          <textarea
            id="description"
            name="description"
            placeholder="Details..."
          ></textarea>
        </div>

        <div class="input-group">
          <label for="due-date">Due date:</label>
          <input type="date" id="due-date" name="due-date" required min="1" />
        </div>

        <div class="input-group">
          <label>Priority:</label>
          <div class="options">
            <label
              ><input
                type="radio"
                id="low"
                name="priority"
                value="low"
                checked
              />
              Low</label
            >
            <label
              ><input type="radio" id="mid" name="priority" value="medium" />
              Medium</label
            >
            <label
              ><input type="radio" id="high" name="priority" value="high" />
              High</label
            >
          </div>
        </div>

        <button type="submit">Submit</button>
      </form>
    </dialog>
    <dialog id="note-modal">
      <h3>Add new note</h3>
      <button id="btn-close-note-modal">X</button>
      <form id="note-form">
        <div class="input-group">
          <label for="title">Title:</label>
          <input type="text" id="title" name="title" />
        </div>
        <div class="input-group">
          <label for="description">Description:</label>
          <textarea
            id="description"
            name="description"
            placeholder="Details..."
            required
          ></textarea>
        </div>

        <button type="submit">Submit</button>
      </form>
    </dialog>
    <dialog id="project-modal">
      <h3>Add new project</h3>
      <button id="btn-close-project-modal">X</button>
      <form id="project-form">
        <div class="input-group">
          <label for="title">Title:</label>
          <input type="text" id="title" name="title" required />
        </div>

        <button type="submit">Submit</button>
      </form>
    </dialog>
  </body>
</html>
